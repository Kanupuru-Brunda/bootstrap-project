<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MyBrand</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Loader -->
<div id="loader"></div>

<!-- Navbar -->
<nav id="navbar" class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">MyBrand</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="menu" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li><a class="nav-link" href="#">Home</a></li>
        <li><a class="nav-link" href="about.html">About</a></li>
        <li><a class="nav-link" href="contact.html">Contact</a></li>
        <li>
          <button onclick="toggleMode()" class="btn btn-sm btn-warning ms-2">🌙</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero text-center text-white d-flex align-items-center">
  <div class="container">
    <h1 class="display-3 fw-bold">Ultimate Bootstrap Project</h1>
    <p class="lead">Final upgraded version with advanced features</p>
    <a href="contact.html" class="btn btn-warning btn-lg">Get Started</a>
  </div>
</section>

<!-- Features -->
<section class="p-5 text-center">
  <div class="container">
    <h2>Features</h2>
    <div class="row g-4 mt-4">

      <div class="col-md-4">
        <div class="card p-4 shadow">
          <i class="bi bi-lightning-charge display-4"></i>
          <h4>Fast</h4>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-4 shadow">
          <i class="bi bi-phone display-4"></i>
          <h4>Responsive</h4>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-4 shadow">
          <i class="bi bi-stars display-4"></i>
          <h4>Modern</h4>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- Footer -->
<footer class="text-center p-4 bg-dark text-white">
  <p>© 2026 MyBrand</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Loader
window.onload = () => {
  document.getElementById("loader").style.display = "none";
};

// Dark mode toggle
function toggleMode() {
  document.body.classList.toggle("dark");
}

// Navbar scroll effect
window.addEventListener("scroll", () => {
  document.getElementById("navbar").classList.toggle("scrolled", window.scrollY > 50);
});
</script>

</body>
</html>
