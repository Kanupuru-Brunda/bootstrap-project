<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

</head>

<body>

<section class="p-5">
  <div class="container">
    <h1 class="text-center">Contact</h1>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow">

          <form onsubmit="sendMail(event)">
            <input id="name" class="form-control mb-3" placeholder="Name" required>
            <input id="email" class="form-control mb-3" placeholder="Email" required>
            <textarea id="message" class="form-control mb-3" placeholder="Message"></textarea>

            <button class="btn btn-primary w-100">Send</button>
          </form>

        </div>
      </div>
    </div>

  </div>
</section>

<script>
(function(){
emailjs.init("YOUR_PUBLIC_KEY");
})();

function sendMail(e){
e.preventDefault();

emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
from_name: document.getElementById("name").value,
email: document.getElementById("email").value,
message: document.getElementById("message").value
}).then(() => {
alert("Message Sent Successfully!");
});
}
</script>

</body>
</html>
